spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=false

spring.mail.host=localhost
spring.mail.port=1025

app.kafka.order-events-topic=autoshop.order-events
app.kafka.order-events-dlt-topic=autoshop.order-events.dlt
app.kafka.topic-partitions=1
app.kafka.topic-replicas=1

app.mail.from=noreply@autoshop.local
app.mail.from-name=AutoShop

app.retry.email.max-attempts=3
app.retry.email.backoff=1ms
app.retry.kafka.max-attempts=1
app.retry.kafka.backoff=1ms
